name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace and published package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - name: Install the minimum consumer runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "20.9.0"
      - name: Remember the minimum runtime
        id: minimum-runtime
        run: echo "node=$(command -v node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm run setup
      - run: pnpm verify
      - name: Verify the package on the minimum runtime
        run: pnpm test:consumer
        env:
          ONEDOCS_RUNTIME_NODE: ${{ steps.minimum-runtime.outputs.node }}
      - run: pnpm audit --prod

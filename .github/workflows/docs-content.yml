name: Docs content

on:
  push:
    branches: ["docs/**"]
    paths:
      - "docs/**"
      - "scripts/check-docs-content.ts"
      - ".github/workflows/docs-content.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check-docs-content.ts"
      - ".github/workflows/docs-content.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check portable documentation
        run: node scripts/check-docs-content.ts --expected-docs 6 --expected-nav 1
